services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/app/data/staff-manager.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      CORS_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      APP_URL: ${APP_ORIGIN:-http://localhost:8080}
      HOTEL_TZ: ${HOTEL_TZ:-Europe/Prague}
      SCHEDULER_TIMEZONE: ${HOTEL_TZ:-Europe/Prague}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Staff Manager <noreply@example.com>}
    volumes:
      - staff-manager-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api
        VITE_USE_MOCKS: "false"
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  staff-manager-data:
